<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#08090D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#090A0F"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="220" fill="url(#coreGlow)"/>

  <!-- Orbital Rings (Bi-Temporal Evolution) -->
  <ellipse cx="256" cy="256" rx="170" ry="80" transform="rotate(-30 256 256)" fill="none" stroke="url(#orbitGrad1)" stroke-width="4" stroke-dasharray="6 8" opacity="0.75"/>
  <ellipse cx="256" cy="256" rx="170" ry="80" transform="rotate(30 256 256)" fill="none" stroke="url(#orbitGrad2)" stroke-width="4" stroke-dasharray="6 8" opacity="0.75"/>

  <!-- Outer Node Coordinates -->
  <circle cx="130" cy="180" r="10" fill="#60A5FA"/>
  <circle cx="382" cy="180" r="10" fill="#34D399"/>
  <circle cx="130" cy="332" r="8" fill="#34D399" opacity="0.8"/>
  <circle cx="382" cy="332" r="8" fill="#60A5FA" opacity="0.8"/>

  <!-- Core Neural Nucleus -->
  <circle cx="256" cy="256" r="48" fill="#0F172A" stroke="url(#orbitGrad1)" stroke-width="4"/>
  <circle cx="256" cy="256" r="28" fill="#2563EB"/>
  <circle cx="256" cy="256" r="12" fill="#FFFFFF"/>

  <!-- Interconnecting Synaptic Rays -->
  <line x1="256" y1="208" x2="256" y2="130" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="256" cy="120" r="6" fill="#60A5FA"/>

  <line x1="256" y1="304" x2="256" y2="382" stroke="#10B981" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="256" cy="392" r="6" fill="#34D399"/>
</svg>

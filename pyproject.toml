[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baby-llm"
version = "0.1.0"
description = "A Privacy-First, Self-Evolving Local Memory & Life Success Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "lancedb>=0.6.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "fastembed>=0.2.7",
    "watchdog>=4.0.0",
    "mcp>=1.0.0,<2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "llama-cpp-python>=0.2.70",
    "huggingface-hub>=0.23.0",
    "pyyaml>=6.0.0"
]

[project.scripts]
baby-llm = "baby_llm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/baby_llm"]
